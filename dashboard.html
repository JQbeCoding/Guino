<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guino Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { penguinBlack: '#1C1C1C', penguinBelly: '#F5F5F0', penguinBeak: '#F4A227', glacialBlue: '#E8F1F5', slateGray: '#5C6B73', nightIce: '#0D1117' },
                    animation: { 'waddle': 'waddle 0.5s ease-in-out infinite alternate', 'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' },
                    keyframes: { waddle: { '0%': { transform: 'rotate(-5deg) translateY(0)' }, '100%': { transform: 'rotate(5deg) translateY(-2px)' } } }
                }
            }
        }
    </script>
    <script>
        // Apply cached theme immediately to avoid a light-mode flash
        if (localStorage.getItem('guino_theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
</head>
<body class="bg-glacialBlue dark:bg-nightIce min-h-screen text-penguinBlack dark:text-penguinBelly font-sans selection:bg-penguinBeak selection:text-white transition-colors">

    <nav class="bg-penguinBlack text-penguinBelly p-4 shadow-lg sticky top-0 z-40 relative" data-guino-nav>
        <div class="max-w-4xl mx-auto flex justify-between items-center gap-3">
            <h1 class="text-2xl font-black tracking-tight shrink-0"><a href="/" data-guino-return class="hover:text-penguinBeak transition-colors"><span class="text-penguinBeak">G</span>uino</a></h1>
            <button type="button" class="md:hidden p-2 rounded hover:bg-slateGray transition-colors shrink-0" aria-expanded="false" aria-controls="guino-nav-menu" data-guino-nav-toggle>
                <svg data-guino-nav-icon-menu class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <svg data-guino-nav-icon-close class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
            <div id="guino-nav-menu" class="hidden md:flex md:items-center md:space-x-4 font-medium text-sm md:text-base absolute md:relative top-full left-0 right-0 md:top-auto md:left-auto md:right-auto bg-penguinBlack border-t border-slateGray/40 md:border-0 shadow-lg md:shadow-none p-3 md:p-0 flex-col md:flex-row gap-0.5 md:gap-0 z-50" data-guino-nav-panel>
                <a href="/" data-guino-return class="px-3 py-2.5 md:py-1 rounded hover:bg-slateGray transition-colors block md:inline-block">Ice Scene</a>
                <span class="px-3 py-2.5 md:py-1 rounded bg-penguinBeak text-penguinBlack block md:inline-block cursor-default">Dashboard</span>
                <a href="/courses" class="px-3 py-2.5 md:py-1 rounded hover:bg-slateGray transition-colors block md:inline-block">Courses</a>
                <a href="/gpa" class="px-3 py-2.5 md:py-1 rounded hover:bg-slateGray transition-colors block md:inline-block">GPA</a>
                <a href="/study" class="px-3 py-2.5 md:py-1 rounded hover:bg-slateGray transition-colors block md:inline-block">Study</a>
                <a href="/settings" class="px-3 py-2.5 md:py-1 rounded hover:bg-slateGray transition-colors block md:inline-block">Settings</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-10 p-4">
        <div class="mb-8 border-b-2 border-slateGray/30 pb-4 flex justify-between items-end">
            <div>
                <h2 class="text-3xl font-bold" id="greeting-header">Good Morning, Quis.</h2>
                <p class="text-slateGray mt-2" id="header-subtitle">Waddling over to Canvas to fetch your classes...</p>
            </div>
        </div>

        <!-- Dynamic List Container -->
        <div class="space-y-6" id="assignment-list">
            <div class="text-center py-10 animate-pulse-slow font-bold text-slateGray">Fetching live Canvas data... 🧊🐧</div>
        </div>
    </main>

    <!-- Overlay Sticky Note -->
    <div id="sticky-overlay" class="fixed inset-0 bg-penguinBlack/80 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4 transition-opacity">
        <div class="bg-penguinBelly text-penguinBlack w-full max-w-lg rounded-sm shadow-2xl p-8 relative transform rotate-1">
            <div class="absolute -top-4 left-1/2 -translate-x-1/2 w-24 h-8 bg-white/50 backdrop-blur-md rotate-2 border border-black/5"></div>
            <div id="sticky-content"></div>
            <div class="mt-8 flex justify-end">
                <button onclick="closeStickyNote()" class="bg-penguinBeak text-penguinBlack font-bold py-2 px-6 rounded-md hover:animate-waddle shadow-[4px_4px_0px_0px_rgba(28,28,28,1)] active:translate-y-1 active:translate-x-1 active:shadow-none transition-all">
                    Slide back to Ice 🧊
                </button>
            </div>
        </div>
    </div>

    <script>
        let globalAssignments = [];

        async function applySettings() {
            try {
                const response = await fetch('/api/settings');
                const data = await response.json();
                const settings = data.settings || {};

                document.documentElement.classList.toggle('dark', settings.theme === 'dark');
                localStorage.setItem('guino_theme', settings.theme || 'light');

                const name = settings.display_name || 'Quis';
                const hour = new Date().getHours();
                const greeting = hour < 12 ? 'Good Morning' : hour < 18 ? 'Good Afternoon' : 'Good Evening';
                document.getElementById('greeting-header').innerText = `${greeting}, ${name}.`;
            } catch (e) {
                console.error("Failed to load settings:", e);
            }
        }

        async function loadAssignments() {
            try {
                const response = await fetch('/api/feed');
                const data = await response.json();
                
                globalAssignments = data.assignments;
                const listDiv = document.getElementById('assignment-list');
                const subtitle = document.getElementById('header-subtitle');
                
                if (globalAssignments.length === 0) {
                    subtitle.innerText = "You are completely caught up!";
                    listDiv.innerHTML = `<div class="text-center py-10 font-bold text-penguinBlack dark:text-penguinBelly text-xl">🎉 Nothing due! Go enjoy the ice.</div>`;
                    return;
                }

                subtitle.innerText = `You have ${globalAssignments.length} active assignments demanding your attention.`;
                listDiv.innerHTML = ''; // Clear loader

                globalAssignments.forEach((assignment, index) => {
                    // Map Backend urgency to UI colors
                    let colorClass = "bg-green-500";
                    let pulseClass = "";
                    if (assignment.urgency.includes("URGENT")) { colorClass = "bg-red-500"; pulseClass = "animate-pulse"; }
                    if (assignment.urgency.includes("SOON")) colorClass = "bg-yellow-500";
                    if (assignment.urgency.includes("OVERDUE")) colorClass = "bg-penguinBlack";

                    const html = `
                    <div class="relative group flex items-start">
                        <div onclick="openStickyNote(${index})" class="absolute -left-12 top-0 mt-1 cursor-pointer transform ${index % 2 === 0 ? '-rotate-3 group-hover:-rotate-6' : 'rotate-2 group-hover:rotate-6'} transition-transform hover:scale-110 z-10 hidden sm:block shadow-sm">
                            <div class="w-8 h-8 bg-penguinBelly border border-slateGray/20 rounded shadow shadow-penguinBeak/20 flex items-center justify-center text-xs">📝</div>
                        </div>
                        <div class="flex-1 pl-4 sm:pl-0">
                            <div class="flex items-center gap-3">
                                <span class="w-3 h-3 rounded-full ${colorClass} ${pulseClass}"></span>
                                <h3 onclick="openStickyNote(${index})" class="text-xl font-semibold hover:text-penguinBeak cursor-pointer transition-colors decoration-2 underline-offset-4 hover:underline">${assignment.title}</h3>
                            </div>
                            <p class="text-slateGray mt-1 ml-6 font-mono text-sm">${assignment.course} • Due: ${assignment.due_str}</p>
                        </div>
                    </div>`;
                    listDiv.insertAdjacentHTML('beforeend', html);
                });
            } catch (e) {
                document.getElementById('assignment-list').innerHTML = `<div class="text-red-500 text-center font-bold">Failed to load from backend.</div>`;
            }
        }

        function openStickyNote(index) {
            const data = globalAssignments[index];
            const overlay = document.getElementById('sticky-overlay');
            const contentDiv = document.getElementById('sticky-content');
            
            // Mock AI Summary using real backend data
            contentDiv.innerHTML = `
                <span class="inline-block px-2 py-1 bg-slateGray/20 text-xs font-bold rounded mb-4">${data.urgency}</span>
                <h3 class="text-2xl font-bold text-penguinBlack mb-2 font-serif">${data.title}</h3>
                <p class="text-slateGray font-mono text-sm mb-6">${data.course}</p>
                
                <p class="text-penguinBlack/80 mb-6 font-medium italic border-l-4 border-penguinBeak pl-4">
                    "Guino AI: You have exactly ${data.hours_left} hours left to finish this. Open the link below to get started!"
                </p>
                
                <a href="${data.url}" target="_blank" class="text-penguinBeak font-bold hover:underline">🔗 Open directly in Canvas &rarr;</a>
            `;
            overlay.classList.remove('hidden');
        }

        function closeStickyNote() {
            document.getElementById('sticky-overlay').classList.add('hidden');
        }

        // Fetch data on page load
        window.onload = () => {
            applySettings();
            loadAssignments();
        };
    </script>
    <script src="/static/app-nav.js"></script>
    <script src="/static/return-scene.js"></script>
</body>
</html>
